name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core

      # CMAKE_MAKE_PROGRAM is set explicitly rather than relying on
      # ninja being on PATH - this runs in a fresh Docker container
      # each time, so "ps2build update ninja"'s install into
      # $PS2DEV/tools/ninja is never actually on PATH here. Matches
      # ps2build's own convention of resolving toolchain tools to
      # absolute paths, not bare PATH lookups.
      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ogg \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --target ogg

      - name: Install
        run: cmake --install build

      - name: Get short SHA
        id: slug
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ogg-${{ steps.slug.outputs.sha8 }}
          path: /opt/ps2dev/packages/world/ogg

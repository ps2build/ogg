name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ogg `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --target ogg

      - name: Install
        shell: pwsh
        run: cmake --install build

      - name: Get short SHA
        id: slug
        shell: pwsh
        run: "'sha8=' + $env:GITHUB_SHA.Substring(0,8) >> $env:GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ogg-${{ steps.slug.outputs.sha8 }}
          path: C:\ps2dev-consumer\packages\world\ogg

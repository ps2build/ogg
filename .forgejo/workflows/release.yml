name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ogg `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --target ogg

      - name: Install
        shell: pwsh
        run: cmake --install build

      # Unsuffixed, matching sdk-core/sdk-world/audsrv - this is
      # cross-compiled PS2 MIPS content, not a host binary.
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path C:\ps2dev-consumer\packages\world\ogg\* -DestinationPath "ogg-$version.zip"

      - name: Publish release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          fj release create $version -t $version -a "ogg-$version.zip" -r ps2/ogg

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force "ogg-*.zip" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

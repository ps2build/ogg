name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: https://git.techwritescode.dev/techwritescode/setup-forgejo@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core,llvm-toolchain

      # CMAKE_MAKE_PROGRAM is set explicitly rather than relying on
      # ninja being on PATH - this runs in a fresh Docker container
      # each time, so "ps2build update ninja"'s install into
      # $PS2DEV/tools/ninja is never actually on PATH here.
      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ogg \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --target ogg

      - name: Install
        run: cmake --install build

      - name: Configure with CMake (llvm)
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build-llvm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/opt/ps2dev/cmake/ps2dev_llvm.cmake \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages-llvm/world/ogg \
            -DBUILD_TESTING=OFF

      - name: Build (llvm)
        run: cmake --build build-llvm --target ogg

      - name: Install (llvm)
        run: cmake --install build-llvm

      # Real, unmodified upstream license text, not generated -
      # cmake --install only copies build outputs (include/lib), never
      # the repo's own root COPYING, so without this the release zip
      # would ship real Xiph.org-licensed code with no license text at
      # all.
      - name: Bundle license
        run: |
          cp COPYING /opt/ps2dev/packages/world/ogg/COPYING
          cp COPYING /opt/ps2dev/packages-llvm/world/ogg/COPYING

      # Unsuffixed, matching sdk-core/sdk-world/audsrv - this is
      # cross-compiled PS2 MIPS content, not a host binary.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          (cd /opt/ps2dev/packages/world/ogg && zip -r "$GITHUB_WORKSPACE/ogg-$version-gcc.zip" .)
          (cd /opt/ps2dev/packages-llvm/world/ogg && zip -r "$GITHUB_WORKSPACE/ogg-$version-llvm.zip" .)

      - name: Publish release
        run: |
          version="${GITHUB_REF_NAME}"
          fj release create "$version" -t "$version" -a "ogg-$version-gcc.zip" -a "ogg-$version-llvm.zip" -r ps2/ogg
